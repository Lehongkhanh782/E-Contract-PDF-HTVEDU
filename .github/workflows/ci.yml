name: Kiểm thử và đóng gói

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  kiem-thu-python:
    name: Kiểm thử phần lõi và API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài thư viện
        run: pip install -r backend/requirements.txt

      - name: Kiểm thử phần lõi
        working-directory: contract_kit
        run: python -m unittest test_core.py test_in_hai_mat.py

      - name: Kiểm thử API và đăng nhập
        run: python -m unittest discover -s backend/tests -t backend

  kiem-thu-giao-dien:
    name: Kiểm tra kiểu dữ liệu và build giao diện
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cài thư viện
        working-directory: frontend
        run: npm ci

      - name: Kiểm tra kiểu dữ liệu
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build
        working-directory: frontend
        run: npm run build

  tao-pdf-that:
    name: Tạo PDF thật bằng LibreOffice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài LibreOffice và font
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libreoffice-writer fonts-dejavu-core fonts-liberation

      - name: Cài thư viện
        run: pip install -r contract_kit/requirements.txt

      - name: Tạo PDF và kiểm tra bố cục cho cả 4 đơn vị
        working-directory: contract_kit
        run: |
          set -e
          for don_vi in vuon_sang_tao victoria gau_panda dai_duong_xanh; do
            echo "--- $don_vi (giáo viên, có thỏa thuận) ---"
            python generate_demo.py --unit "$don_vi" --output "out/$don_vi.pdf"
            # PDF hỏng thường nhỏ bất thường; chặn trường hợp file rỗng.
            kich_thuoc=$(stat -c%s "out/$don_vi.pdf")
            echo "$don_vi: $kich_thuoc bytes"
            test "$kich_thuoc" -gt 50000
            # Mỗi phần phải bắt đầu ở trang lẻ để in hai mặt tách tờ được,
            # mức bồi thường và nơi làm việc phải đúng theo từng đơn vị.
            python kiem_tra_bo_cuc.py "out/$don_vi.pdf" \
              --unit "$don_vi" --position english_teacher
          done

      - name: Vị trí không phải ký thỏa thuận thì PDF không được có tờ đó
        working-directory: contract_kit
        run: |
          set -e
          python - <<'PYEOF'
          import json
          from pathlib import Path
          data = json.loads(Path("examples/employee_demo.json").read_text(encoding="utf-8"))
          data["job"]["position_id"] = "principal"
          # Hiệu trưởng có lương cơ bản 7.000.000 nên Gross phải cao hơn mức đó.
          data["compensation"].update({
              "salary_amount": "9000000",
              "insurance_base": "7000000",
              "employer_union_base": "7000000",
              "employee_union_base": "7000000",
          })
          Path("out").mkdir(exist_ok=True)
          Path("out/hieu_truong.json").write_text(
              json.dumps(data, ensure_ascii=False), encoding="utf-8")
          PYEOF
          python generate_demo.py --unit victoria \
            --input out/hieu_truong.json --output out/hieu_truong.pdf
          python kiem_tra_bo_cuc.py out/hieu_truong.pdf \
            --unit victoria --position principal

      - name: Bài kiểm tra bố cục phải bắt được sai lệch
        working-directory: contract_kit
        run: |
          set -e
          # Khai sai vị trí thì phải báo lỗi. Nếu không, bài kiểm tra vô dụng.
          if python kiem_tra_bo_cuc.py out/hieu_truong.pdf \
               --unit victoria --position english_teacher; then
            echo "Bài kiểm tra bố cục không bắt được thiếu thỏa thuận"
            exit 1
          fi
          if python kiem_tra_bo_cuc.py out/victoria.pdf \
               --unit victoria --position principal; then
            echo "Bài kiểm tra bố cục không bắt được thừa thỏa thuận"
            exit 1
          fi
          echo "Bài kiểm tra bố cục hoạt động đúng"

      - name: Giữ lại PDF để tải về xem
        uses: actions/upload-artifact@v4
        with:
          name: pdf-thu-nghiem
          path: contract_kit/out/*.pdf
          retention-days: 7

  dong-goi:
    name: Build image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: econtract:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Chạy thử image
        run: |
          set -e
          docker run -d --name econtract -p 8000:8000 \
            -e ECONTRACT_SECRET_KEY="$(head -c 48 /dev/urandom | base64 | tr -d '\n')" \
            econtract:ci
          # Chờ máy chủ sẵn sàng, tối đa 60 giây.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then
              echo "Máy chủ đã sẵn sàng"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health
          echo
          # Chưa đăng nhập thì phải bị chặn.
          ma=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/units)
          echo "Gọi /api/units khi chưa đăng nhập: HTTP $ma"
          test "$ma" = "401"
          # Trang chủ phải trả về giao diện đã build.
          curl -fsS http://127.0.0.1:8000/ | grep -q "<div id=\"root\">"
          echo "Giao diện được phục vụ đúng"
          docker logs econtract
          docker rm -f econtract
